[build-system]
requires = ["pdm-backend>=2.4.0"]
build-backend = "pdm.backend"

[project]
name = "codingame-tools"
version = "2.0.3"
description = "Python package codingame-tools"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Sam McKelvie", email = "dev@mckelvie.org" },
]
keywords = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
      "json-data-types>=0.2.0",
      # Pinned exactly, not ranged: codingame_tools/common/dataclass_wizard_x.py works around an
      # upstream CatchAll bug in 1.0.0 using dataclass_wizard's private API, so an upgrade can break
      # it. See that module's docstring, including how to remove the workaround once upstream ships
      # a fix. (Previously a git+https:// pin to our own fork -- PyPI rejects direct URL
      # dependencies, so that could never be published.)
      "dataclass-wizard==1.0.0",
      "playwright>=1.61.0",
      "private-files>=3.0.0",
      "aiohttp>=3.14.1",
      "filelock>=3.30.3",
      "typing-extensions>=4.12.0",
      "argparse-wizard>=2.1.2",
      "rich>=15.0.0",
      "pytimeparse2>=1.7.1",
      "pyyaml>=6.0.2",
      "platformdirs>=4.3.0"
]

[project.urls]
Homepage = "https://github.com/mckelvie-org/codingame-tools"
Source = "https://github.com/mckelvie-org/codingame-tools/tree/v2.0.3"
"Bug Tracker" = "https://github.com/mckelvie-org/codingame-tools/issues"
# The rendered site, not the Markdown source -- this is the "Documentation" link in PyPI's sidebar.
# Tracks `dev` on main and is pinned to the release's own X.Y when a release is cut, the same way
# README's links are (bin/cut-rc, via scripts/rewrite_readme_links.py --pin-docs).
Documentation = "https://mckelvie-org.github.io/codingame-tools/2.0/"
Changelog = "https://github.com/mckelvie-org/codingame-tools/blob/v2.0.3/CHANGELOG.md"

[project.scripts]
cg = "codingame_tools.cli.main:main"

[dependency-groups]
dev = [
    "pillow>=10.1.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "pdm>=2.27.0",
    "vcrpy>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "types-PyYAML>=6.0.12",
]
docs = [
    # The site is built with ProperDocs, the maintained continuation of MkDocs 1.x -- not with
    # MkDocs itself. MkDocs 2.0 removes the plugin system outright with no migration path, and every
    # entry below is a plugin; mkdocstrings alone generates the 125-page API reference. So 2.0 is
    # not an upgrade for this project, it is a different tool that shares a name on PyPI.
    #
    # This follows the ecosystem rather than betting against it: mkdocs-gen-files and
    # mkdocs-literate-nav already require properdocs and cap `mkdocs<=1.6.1` themselves, and `mike`
    # auto-detects ProperDocs as its builder while still reading mkdocs.yml. `mkdocs` stays listed
    # only because those plugins still import it; the `<2` cap stops a future relock from crossing
    # the major version underneath us.
    #
    # Zensical -- from Material's author -- is the other successor and the likelier long-term home,
    # since Material for MkDocs is where the theme is going. It is not ready for this project yet:
    # see the re-test recipe in doc/design/docs-toolchain.md.
    "properdocs>=1.6.7",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<10",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-autorefs>=1.4.4",
    "mike>=2.2.0",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
]

[tool.pytest.ini_options]
addopts = "-ra -m \"not live and not live_unauthenticated and not docker\""
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_unauthenticated: hits the real CodinGame API directly (no cassette), no login required; excluded by default, never runs in CI",
    "live: hits the real CodinGame API directly (no cassette), requires a prior browser login with real credentials; excluded by default, never runs in CI",
    "docker: builds/runs real containers via the docker CLI; slow (pulls a base image on first run) and needs a working daemon, so excluded by default. Run with `-m docker`",
]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [".codingame", ".cg_api", "contribution", "puzzle"]
# Without this, exclude/extend-exclude only apply to directory scans (e.g. `ruff check .`)--an
# explicitly-passed path (as the VS Code Ruff extension passes for whatever file is open) bypasses
# them entirely by default. This is what actually makes the "contribution"/"puzzle" exclusions
# take effect in the editor, not just on the CLI.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["codingame_tools"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["codingame_tools"]
exclude = ["^\\.codingame/", "^\\.cg_api/"]
# `scripts/` holds dev tooling (the docs generator) that tests import directly; it isn't a package,
# so mypy needs to be told where to find it.
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = ["vcr.*"]
ignore_missing_imports = true

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["codingame_tools"]

[tool.pdm.scripts]
test = "pytest"
# --strict turns an unresolved cross-reference into a build failure. With 643 of them in
# docstrings, that is the difference between a reference you can trust and one that quietly
# rots -- so CI runs this, not the lenient build.
# `properdocs`, not `mkdocs` -- see the docs dependency group for why. The config file keeps its
# `mkdocs.yml` name (ProperDocs reads it, and so does Zensical, which keeps the re-test in
# doc/design/docs-toolchain.md a one-liner), but it is passed explicitly: ProperDocs treats the name
# as a legacy fallback it intends to remove, and says so on every build unless told outright.
docs-build = "properdocs build --strict -f mkdocs.yml"
docs-serve = "properdocs serve -f mkdocs.yml"
# Serves the site and opens it in a dedicated browser window, shutting the server down when
# that window closes -- see scripts/serve_docs.py for why the lifetime is tied together.
docs = "python scripts/serve_docs.py"
gen-default-cover-image = "python scripts/gen_cover_placeholder.py"
test-live-unauthenticated = "pytest -m live_unauthenticated"
test-live = "pytest -m live"
lint = "ruff check ."
typecheck = "mypy codingame_tools"
post_install = "./bin/post-install"
