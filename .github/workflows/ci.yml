name: CI
run-name: "CI · ${{ github.ref_name }}"

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4.5
        with:
          python-version: ${{ matrix.python-version }}
          cache: true

      - name: Install dependencies
        run: pdm install -G dev

      - name: Lint
        run: pdm run lint

      - name: Type check
        run: pdm run typecheck

      - name: Test
        run: pdm run test

  docs:
    # Separate job, single Python: the docs build exercises the same source as `test`, so running it
    # across the whole matrix would repeat identical work five times. --strict fails on unresolved
    # cross-references, which is the check worth having -- the API reference is generated, so a
    # renamed symbol breaks links silently otherwise.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4.5
        with:
          python-version: "3.12"
          cache: true

      - name: Install dependencies
        run: pdm install -G docs

      - name: Build docs (strict)
        run: pdm run docs-build
